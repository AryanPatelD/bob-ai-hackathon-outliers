submission:
  title: "GridWise AI — Grid Load Optimisation & Renewable Energy Performance Advisor"

  problem_statement: >
    Grid operators must simultaneously forecast electricity demand spikes,
    understand renewable generation availability, detect underperforming solar and
    wind assets, identify probable root causes, and minimise renewable curtailment —
    all in real time and under operational pressure. No existing tool integrates
    these tasks with conversational AI assistance in one operator interface.

  solution_summary: >
    GridWise AI is a full-stack analytics and optimisation platform that chains
    XGBoost load forecasting, physics-based renewable generation models, deterministic
    anomaly detection, evidence-based root cause analysis, and a priority-order BESS and
    demand-response optimisation engine. IBM Bob is integrated via a custom MCP server
    exposing nine backend tools, enabling operators to query computed results
    conversationally and receive structured briefings without fabricated data.

  key_features:
    - "XGBoost demand forecast (R2=0.90 test) with leakage-free chronological split and 24h horizon"
    - "Physics-based solar and wind expected generation with explainable step-by-step model"
    - "Evidence-based root cause analysis separating weather-explained from unexplained asset losses"
    - "Priority-order grid optimisation engine (BESS -> DR -> backup) with all SOC constraints enforced"
    - "IBM Bob MCP server with 9 tools consuming live backend results — no fabricated telemetry"

  tech_stack:
    languages: ["Python", "TypeScript", "HTML", "CSS", "JavaScript"]
    frameworks: ["FastAPI", "XGBoost", "scikit-learn", "pandas", "numpy", "Pydantic"]
    ibm_technologies: ["IBM Bob", "MCP (Model Context Protocol)"]
    databases: ["Apache Parquet (via pyarrow)"]
    other: ["uvicorn", "Node.js", "Zod", "pytest"]

  what_we_are_most_proud_of: >
    The end-to-end evidence chain from raw synthetic telemetry through physics models,
    anomaly detection, and root cause analysis to a structured operator brief — all
    accessible to IBM Bob via a custom MCP server that strictly reads computed backend
    results rather than fabricating any values. The RCA engine correctly distinguishes
    weather-explained losses (heavy clouds = no fault) from genuinely unexplained losses
    (clear sky + low output = inspect the inverter), which is a real operational challenge.

  known_limitations: >
    All data is synthetic and not real grid telemetry. The load forecast is trained on
    synthetic data only. Economic dispatch and market price signals are not modelled.
    BESS optimisation is forward-greedy per interval, not multi-day rolling. The Bob
    advisor routes queries by keyword matching in the dashboard UI; full LLM tool-call
    chaining requires the MCP server to be running alongside the API. Authentication
    and multi-user support are not implemented. No CI/CD pipeline.

